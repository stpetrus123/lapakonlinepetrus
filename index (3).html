    <style>

        body {
            background-color: #faf6f0; /* Warm Cream */
            color: #2c221e;

        }

        header {
            background: linear-gradient(135deg, #4a2e1b, #7c4a27); /* Warm Cokelat Dark Gradient */

            padding: 2.2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(74, 46, 27, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-logo {
            width: 85px;
            height: auto;
            margin-bottom: 0.8rem;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
        }

        header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.4rem;
            color: #fff8f0;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
            color: #f3e5d8;
        }

        .container {
            max-width: 1140px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Navigasi Filter Kategori & Toko */
        .filter-section-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #8c6d58;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 0.6rem;
        }

        .filter-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 1.2rem;
            scrollbar-width: thin;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid #e7d8c9;
            padding: 9px 20px;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            font-size: 0.88rem;
            color: #6b5344;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .filter-btn.active, .filter-btn:hover {
            background: #7c4a27;
            color: #ffffff;
            border-color: #7c4a27;
            box-shadow: 0 4px 12px rgba(124, 74, 39, 0.25);
        }

        /* Panel Khusus Penjual / Aksi Toko */
        .seller-action-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .btn-seller-action {
            background: #ffffff;
            color: #7c4a27;
            border: 1px dashed #7c4a27;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-seller-action:hover {
            background: #fdf2e9;
        }

        /* Judul Pemisah Kategori Produk */
        .category-section-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #3b2315;
            margin: 2rem 0 1.2rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e7d8c9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Grid Produk */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .product-card {
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(74, 46, 27, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #f0e6dc;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(74, 46, 27, 0.12);
        }

        /* Foto Produk Kotak (Square Aspect Ratio 1:1) */
        .product-img-wrapper {
            width: 100%;
            padding-top: 100%;
            position: relative;
            background-color: #f7f1ea;
        }

        .product-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 1.2rem;
            flex-grow: 1;
        }

        .badges-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .store-badge {
            display: inline-block;
            background: #fdf2e9;
            color: #7c4a27;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #f5dfce;
        }

        .category-badge {
            display: inline-block;
            background: #f3ece6;
            color: #6b5344;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2c221e;
            margin-bottom: 6px;
        }

        .product-desc {
            font-size: 0.85rem;
            color: #7a6558;
            margin-bottom: 12px;
            line-height: 1.45;
        }

        .product-price {
            font-size: 1.18rem;
            font-weight: 800;
            color: #8c4211;
            margin-bottom: 12px;
        }

        .product-action {
            padding: 1rem 1.2rem;
            background: #faf6f0;
            border-top: 1px solid #f0e6dc;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Control Kuantitas Maksimal 20 */
        .qty-input-group {
            display: flex;
            align-items: center;
            border: 1px solid #d9c4b1;
            border-radius: 10px;
            overflow: hidden;
            background: #ffffff;
        }

        .qty-input-group button {
            background: #f3ece6;
            border: none;
            width: 30px;
            height: 36px;
            font-weight: bold;
            color: #4a2e1b;
            cursor: pointer;
            transition: background 0.2s;
        }

        .qty-input-group button:hover {
            background: #e7d8c9;
        }

        .qty-input {
            width: 36px;
            height: 36px;
            border: none;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2c221e;
            -moz-appearance: textfield;
        }

        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .btn-add {
            flex-grow: 1;
            background: #7c4a27;
            color: #ffffff;
            border: none;
            height: 36px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-add:hover {
            background: #5c3519;
        }

        .btn-add:active {
            transform: scale(0.98);
        }

        /* Floating Cart Button */
        .cart-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #4a2e1b;
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(74, 46, 27, 0.3);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 99;
            transition: transform 0.2s, background 0.2s;
        }

        .cart-float:hover {
            transform: scale(1.04);
            background: #382112;
        }

        .cart-badge {
            background: #d9534f;
            color: white;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.8rem;
        }

        /* Modal Umum */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 34, 30, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.6rem;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0e6dc;
            padding-bottom: 12px;
            margin-bottom: 1rem;
        }

        .modal-header h3 {
            font-size: 1.25rem;
            color: #3b2315;
            font-weight: 800;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: #a89485;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0e6dc;
        }

        .cart-summary {
            margin-top: 1rem;
            padding-top: 12px;
            border-top: 2px solid #e7d8c9;
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            color: #3b2315;
        }

        .form-group {
            margin-top: 1.1rem;
        }

            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #4a2e1b;
            margin-bottom: 6px;
        }

            padding: 11px 14px;
            border: 1px solid #d9c4b1;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;

            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(124, 74, 39, 0.12);

            background: #7c4a27;
            color: white;
            border: none;
            padding: 14px;

            margin-top: 1.5rem;

            font-size: 1rem;

            background: #5c3519;

    <header>

    </header>

    <div class="container">

        <div class="seller-action-bar">

                🏪 + Buka Toko Baru
            </button>
            <button class="btn-seller-action" onclick="openAddMenuModal()">
                🍽️ + Tambah Menu Toko
            </button>
        </div>

        <!-- Filter Berdasarkan Kategori -->
        <div class="filter-section-title">Pilih Kategori</div>
        <div class="filter-container" id="category-filters"></div>

        <!-- Filter Berdasarkan Toko -->
        <div class="filter-section-title">Pilih Toko</div>
        <div class="filter-container" id="store-filters"></div>

        <!-- Catalog Container -->
        <div id="catalog-container"></div>
    </div>

    <!-- Floating Button Keranjang -->
    <button class="cart-float" onclick="openCart()">
        🛒 Keranjang <span class="cart-badge" id="cart-count">0</span>
    </button>

    <!-- Modal Tambah Toko Baru -->
    <div class="modal" id="add-store-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Pendaftaran Toko Baru</h3>
                <button class="close-btn" onclick="closeAddStoreModal()">&times;</button>
            </div>
            <form id="add-store-form" onsubmit="processAddStore(event)">
                <div class="form-group">
                    <label for="new-store-name">Nama Toko / UMKM *</label>
                    <input type="text" id="new-store-name" required placeholder="Contoh: Dapur Berkat">
                </div>
                <div class="form-group">
                    <label for="new-store-wa">Nomor WhatsApp Toko (Format: 628...) *</label>
                    <input type="text" id="new-store-wa" required placeholder="Contoh: 6281234567890">
                </div>
                <button type="submit" class="btn-modal-submit">Daftarkan Toko</button>
            </form>
        </div>
    </div>

    <!-- Modal Tambah Menu / Produk Baru -->
    <div class="modal" id="add-menu-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Tambah Menu Produk Toko</h3>
                <button class="close-btn" onclick="closeAddMenuModal()">&times;</button>
            </div>
            <form id="add-menu-form" onsubmit="processAddMenu(event)">
                <div class="form-group">
                    <label for="target-store-select">Pilih Toko Anda *</label>
                    <select id="target-store-select" required></select>
                </div>
                <div class="form-group">
                    <label for="new-menu-name">Nama Menu / Produk *</label>
                    <input type="text" id="new-menu-name" required placeholder="Contoh: Nasi Kuning Spesial">
                </div>
                <div class="form-group">
                    <label for="new-menu-category">Kategori *</label>
                    <select id="new-menu-category" required>
                        <option value="makanan">Makanan</option>
                        <option value="minuman">Minuman</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="new-menu-price">Harga (Rp) *</label>
                    <input type="number" id="new-menu-price" min="0" required placeholder="Contoh: 15000">
                </div>
                <div class="form-group">
                    <label for="new-menu-desc">Deskripsi Produk *</label>
                    <textarea id="new-menu-desc" rows="2" required placeholder="Deskripsi singkat produk..."></textarea>
                </div>
                <div class="form-group">
                    <label for="new-menu-img">URL Gambar / Foto Produk *</label>
                    <input type="url" id="new-menu-img" required placeholder="https://contoh.com/gambar.jpg">
                </div>
                <button type="submit" class="btn-modal-submit">Simpan & Terbitkan Menu</button>
            </form>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Keranjang Belanja</h3>
                <button class="close-btn" onclick="closeCart()">&times;</button>
            </div>

            <div id="cart-items">
                <p style="text-align: center; color: #a89485; padding: 1.5rem 0;">Keranjang belanja masih kosong.</p>
            </div>

            <div class="cart-summary">
                <span>Total Biaya:</span>
                <span id="cart-total-price">Rp 0</span>
            </div>

            <!-- Form Pemesan -->
            <form id="checkout-form" onsubmit="processCheckout(event)">
                <div class="form-group">
                    <label for="cust-name">Nama Pemesan *</label>
                    <input type="text" id="cust-name" required placeholder="Masukkan nama Anda">
                </div>
                <div class="form-group">
                    <label for="cust-address">Alamat Pengiriman / Catatan Pesanan *</label>
                    <textarea id="cust-address" rows="2" required placeholder="Masukkan alamat atau catatan pengiriman"></textarea>
                </div>
                <div class="form-group">
                    <label for="payment-method">Metode Pembayaran (Non-Rekening) *</label>
                    <select id="payment-method" required>
                        <option value="Tunai / COD (Bayar di Tempat)">Tunai / COD (Bayar di Tempat)</option>
                        <option value="QRIS / E-Wallet (Minta QRIS / No. E-Wallet via WA)">QRIS / E-Wallet (Minta QRIS/Nomor via WA)</option>
                        <option value="Konfirmasi Kesepakatan di WA">Lainnya (Konfirmasi via WA)</option>
                    </select>
                </div>
                <button type="submit" class="btn-checkout">Pesan via WhatsApp</button>
            </form>
        </div>
    </div>

                        desc: "Paduan makaroni lembut, daging pilihan, dan lelehan keju gurih yang dipanggang sempurna. Creamy dan nagih di setiap suapan!.",
                        price: 5500,
                        image: "https://i.ibb.co.com/Kx6wzsyn/Screenshot-2026-10-08-012220.png"
                    },
                    { id: "lo-10",
                        name: "Brownies / loyang",
                        category: "makanan",
                        desc: "Lembut di dalam dengan tekstur fudgy dan rasa cokelat pekat yang nendang banget. Manisnya pas, teman ngopi atau ngeteh paling juara!",
                        price: 65000,
                        image: "https://i.ibb.co.com/nMfcdLSF/Screenshot-2026-10-08-012552.png"
                    },
                    { id: "lo-11",
                        name: "Puding Mutiara",
                        category: "makanan",
                        desc: "Manis, segar, dengan butiran mutiara kenyal yang cantik di dalam puding lembut. Dessert dingin yang paling pas untuk sejukkan hari!",
                        price: 3500,
                        image: "https://i.ibb.co.com/gNSStrQ/Screenshot-2026-10-08-012906.png"
                    },
                     { id: "lo-12",
                        name: "Nagasari",
                        category: "makanan",
                        desc: "Lembutnya adonan tepung beras dan santan dengan isian pisang manis di dalamnya, terbungkus rapi daun pisang. Jajanan tradisional penuh kenangan yang selalu bikin rindu!",
                        price: 3500,
                        image: "https://i.ibb.co.com/vxgj7TwK/Screenshot-2026-10-08-013119.png"
                    },
                     { id: "lo-13",
                        name: "Aneka Nasi Bakar",
                        category: "makanan",
                        desc: "Nasi gurih berempah dengan beragam pilihan isian lezat, terbungkus daun pisang lalu dibakar harum. Nikmat disantap selagi hangat!",
                        price: 15000,
                        image: "https://buckets.sasa.co.id/v1/AUTH_Assets/Assets/p/website/medias/page_medias/Nasi_Liwet_Bakar_.jpeg"
                    },
                    { id: "lo-14",
                        name: "kimbab",
                        category: "makanan",
                        desc: "Gulungan nasi ala Korea dengan isian sayuran segar, telur, dan protein gurih yang dibalut nori harum. Praktis, sehat, dan mengenyangkan!",
                        price: 20000,
                        image: "https://img-global.cpcdn.com/recipes/12ff5e603d9d2ef9/680x781cq80/kimbab-gimbab-korean-sushi-roll-foto-resep-utama.jpg"
                        
                    },
                ]
            }
        ];

        // Load storesData dari localStorage atau gunakan data awal
        let storesData = JSON.parse(localStorage.getItem('lapak_stores_data')) || initialStoresData;

        let cart = [];
        let currentStoreFilter = 'ALL';
        let currentCategoryFilter = 'ALL';

        function saveStoresToLocalStorage() {
            localStorage.setItem('lapak_stores_data', JSON.stringify(storesData));
        }

        function renderCategoryFilters() {
            const container = document.getElementById('category-filters');
            container.innerHTML = '';

            const categories = [
                { id: 'ALL', name: 'Semua Kategori' },
                { id: 'makanan', name: '🍔 Makanan' },
                { id: 'minuman', name: '🥤 Minuman' }
            ];

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${currentCategoryFilter === cat.id ? 'active' : ''}`;
                btn.textContent = cat.name;
                btn.onclick = () => filterCategory(cat.id);
                container.appendChild(btn);
            });
        }

        function renderStoreFilters() {
            const filterContainer = document.getElementById('store-filters');
            filterContainer.innerHTML = '';

            const btnAll = document.createElement('button');
            btnAll.className = `filter-btn ${currentStoreFilter === 'ALL' ? 'active' : ''}`;
            btnAll.textContent = 'Semua Toko';
            btnAll.onclick = () => filterStore('ALL');
            filterContainer.appendChild(btnAll);

            storesData.forEach(store => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${currentStoreFilter === store.storeName ? 'active' : ''}`;
                btn.textContent = store.storeName;
                btn.onclick = () => filterStore(store.storeName);
                filterContainer.appendChild(btn);
            });
        }

        function populateStoreSelect() {
            const selectElem = document.getElementById('target-store-select');
            if(!selectElem) return;
            selectElem.innerHTML = '';
            storesData.forEach(store => {
                const opt = document.createElement('option');
                opt.value = store.storeName;
                opt.textContent = store.storeName;
                selectElem.appendChild(opt);
            });
        }

        function createProductCardHTML(prod, storeName) {
            const categoryLabel = prod.category === 'minuman' ? '🥤 Minuman' : '🍔 Makanan';
            return `
                <div class="product-card">
                    <div>
                        <div class="product-img-wrapper">
                            <img src="${prod.image}" alt="${prod.name}" class="product-img">
                        </div>
                        <div class="product-info">
                            <div class="badges-container">
                                <span class="store-badge">${storeName}</span>
                                <span class="category-badge">${categoryLabel}</span>
                            </div>
                            <div class="product-name">${prod.name}</div>
                            <div class="product-desc">${prod.desc}</div>
                            <div class="product-price">Rp ${prod.price.toLocaleString('id-ID')}</div>
                        </div>
                    </div>
                    <div class="product-action">
                        <div class="qty-input-group">
                            <button type="button" onclick="adjustQty('${prod.id}', -1)">-</button>
                            <input type="number" id="qty-${prod.id}" class="qty-input" value="1" min="1" max="20" readonly>
                            <button type="button" onclick="adjustQty('${prod.id}', 1)">+</button>
                        </div>
                        <button class="btn-add" onclick="addToCart('${prod.id}')">+ Tambah</button>
                    </div>
                </div>
            `;
        }

        function renderCatalog() {
            const container = document.getElementById('catalog-container');
            container.innerHTML = '';

            const makananList = [];
            const minumanList = [];

            storesData.forEach(store => {
                if (currentStoreFilter !== 'ALL' && currentStoreFilter !== store.storeName) return;

                store.products.forEach(prod => {
                    if (currentCategoryFilter !== 'ALL' && currentCategoryFilter !== prod.category) return;

                    const productData = { prod, storeName: store.storeName };
                    if (prod.category === 'minuman') {
                        minumanList.push(productData);
                    } else {
                        makananList.push(productData);
                    }
                });
            });

            if (makananList.length === 0 && minumanList.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #a89485; padding: 2.5rem 0;">Tidak ada produk yang cocok dengan filter pilihan Anda.</p>`;
                return;
            }

            if (makananList.length > 0) {
                const makananTitle = document.createElement('div');
                makananTitle.className = 'category-section-title';
                makananTitle.innerHTML = `🍔 Makanan (${makananList.length})`;
                container.appendChild(makananTitle);

                const makananGrid = document.createElement('div');
                makananGrid.className = 'catalog-grid';
                makananGrid.innerHTML = makananList.map(item => createProductCardHTML(item.prod, item.storeName)).join('');
                container.appendChild(makananGrid);
            }

            if (minumanList.length > 0) {
                const minumanTitle = document.createElement('div');
                minumanTitle.className = 'category-section-title';
                minumanTitle.innerHTML = `🥤 Minuman (${minumanList.length})`;
                container.appendChild(minumanTitle);

                const minumanGrid = document.createElement('div');
                minumanGrid.className = 'catalog-grid';
                minumanGrid.innerHTML = minumanList.map(item => createProductCardHTML(item.prod, item.storeName)).join('');
                container.appendChild(minumanGrid);
            }
        }

        function adjustQty(productId, change) {
            const input = document.getElementById(`qty-${productId}`);
            if (!input) return;
            let val = parseInt(input.value) + change;
            if (val < 1) val = 1;
            if (val > 20) {
                val = 20;
                alert("Maksimal pembelian untuk item ini adalah 20 pcs.");
            }
            input.value = val;
        }

        function filterCategory(category) {
            currentCategoryFilter = category;
            renderCategoryFilters();
            renderCatalog();
        }

        function filterStore(storeName) {
            currentStoreFilter = storeName;
            renderStoreFilters();
            renderCatalog();
        }

        /* Handler Modal Toko Baru & Tambah Menu */
        function openAddStoreModal() {
            document.getElementById('add-store-modal').style.display = 'flex';
        }
        function closeAddStoreModal() {
            document.getElementById('add-store-modal').style.display = 'none';
            document.getElementById('add-store-form').reset();
        }

        function openAddMenuModal() {
            populateStoreSelect();
            document.getElementById('add-menu-modal').style.display = 'flex';
        }
        function closeAddMenuModal() {
            document.getElementById('add-menu-modal').style.display = 'none';
            document.getElementById('add-menu-form').reset();
        }

        function processAddStore(event) {
            event.preventDefault();
            const name = document.getElementById('new-store-name').value.trim();
            const wa = document.getElementById('new-store-wa').value.trim();

            const existing = storesData.find(s => s.storeName.toLowerCase() === name.toLowerCase());
            if (existing) {
                alert("Nama toko sudah terdaftar di sistem!");
                return;
            }

            storesData.push({
                storeName: name,
                whatsapp: wa,
                products: []
            });

            saveStoresToLocalStorage();
            renderStoreFilters();
            renderCatalog();
            closeAddStoreModal();
            alert(`Toko baru "${name}" berhasil didaftarkan!`);
        }

        function processAddMenu(event) {
            event.preventDefault();
            const storeName = document.getElementById('target-store-select').value;
            const name = document.getElementById('new-menu-name').value.trim();
            const category = document.getElementById('new-menu-category').value;
            const price = parseInt(document.getElementById('new-menu-price').value);
            const desc = document.getElementById('new-menu-desc').value.trim();
            const image = document.getElementById('new-menu-img').value.trim();

            const targetStore = storesData.find(s => s.storeName === storeName);
            if (!targetStore) {
                alert("Toko tidak ditemukan!");
                return;
            }

            const newId = 'prod-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            targetStore.products.push({
                id: newId,
                name: name,
                category: category,
                desc: desc,
                price: price,
                image: image
            });

            saveStoresToLocalStorage();
            renderCatalog();
            closeAddMenuModal();
            alert(`Menu "${name}" berhasil ditambahkan ke toko ${storeName}!`);
        }

        function addToCart(productId) {
            let foundProduct = null;
            let foundStore = null;

            for (const store of storesData) {
                const prod = store.products.find(p => p.id === productId);
                if (prod) {
                    foundProduct = prod;
                    foundStore = store.storeName;
                    break;
                }
            }

            if (!foundProduct) return;

            const qtyInput = document.getElementById(`qty-${productId}`);
            const qtyToAdd = parseInt(qtyInput.value) || 1;

            const existingIndex = cart.findIndex(item => item.id === foundProduct.id);

            if (existingIndex > -1) {
                let newQty = cart[existingIndex].qty + qtyToAdd;
                if (newQty > 20) {
                    alert(`Jumlah pesanan di keranjang untuk item ini telah dibatasi maksimal 20 pcs.`);
                    cart[existingIndex].qty = 20;
                } else {
                    cart[existingIndex].qty = newQty;
                }
            } else {
                cart.push({
                    id: foundProduct.id,
                    name: foundProduct.name,
                    price: foundProduct.price,
                    storeName: foundStore,
                    qty: qtyToAdd > 20 ? 20 : qtyToAdd
                });
            }

            updateCartUI();
            alert(`${foundProduct.name} (${qtyToAdd} pcs) berhasil ditambahkan ke keranjang.`);
            qtyInput.value = 1;
        }

        function updateCartUI() {
            const cartCountElem = document.getElementById('cart-count');
            const cartItemsElem = document.getElementById('cart-items');
            const cartTotalElem = document.getElementById('cart-total-price');

            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            if (cartCountElem) cartCountElem.innerText = totalItems;

            if (!cartItemsElem || !cartTotalElem) return;

            if (cart.length === 0) {
                cartItemsElem.innerHTML = "<p style='text-align: center; color: #a89485; padding: 1.5rem 0;'>Keranjang belanja masih kosong.</p>";
                cartTotalElem.innerText = "Rp 0";
                return;
            }

            let itemsHTML = "";
            let totalPrice = 0;

            cart.forEach((item, idx) => {
                const subtotal = item.price * item.qty;
                totalPrice += subtotal;

                itemsHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong> <br>
                            <small style="color: #7a6558;">[${item.storeName}]</small><br>
                            <span style="font-size: 0.88rem; color: #4a2e1b;">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty} pcs</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="font-weight: 700; color: #2c221e;">Rp ${subtotal.toLocaleString('id-ID')}</span>
                            <button onclick="removeFromCart(${idx})" style="background:#d9534f; color:white; border:none; border-radius:6px; width:26px; height:26px; cursor:pointer; font-weight:bold;">&times;</button>
                        </div>
                    </div>
                `;
            });

            cartItemsElem.innerHTML = itemsHTML;
            cartTotalElem.innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function openCart() {
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function processCheckout(event) {
            event.preventDefault();

            if (cart.length === 0) {
                alert("Keranjang Anda masih kosong!");
                return;
            }

            const name = document.getElementById('cust-name').value;
            const address = document.getElementById('cust-address').value;
            const payment = document.getElementById('payment-method').value;

            const ordersByStore = {};

            cart.forEach(item => {
                if (!ordersByStore[item.storeName]) {
                    ordersByStore[item.storeName] = [];
                }
                ordersByStore[item.storeName].push(item);
            });

            Object.keys(ordersByStore).forEach(storeName => {
                const storeObj = storesData.find(s => s.storeName === storeName);
                if (!storeObj) return;

                const storeItems = ordersByStore[storeName];
                let grandTotal = 0;

                let message = `Halo *${storeName}*, saya ingin memesan produk berikut dari *Lapak Santo Petrus Pekalongan*:\n\n`;
                
                storeItems.forEach((item, i) => {
                    const subtotal = item.price * item.qty;
                    grandTotal += subtotal;
                    message += `${i + 1}. *${item.name}*\n`;
                    message += `   Jumlah: ${item.qty} x Rp ${item.price.toLocaleString('id-ID')} = Rp ${subtotal.toLocaleString('id-ID')}\n\n`;
                });

                message += `*Total Pembayaran:* Rp ${grandTotal.toLocaleString('id-ID')}\n`;
                message += `-----------------------------------\n`;
                message += `*Data Pemesan:*\n`;
                message += `• Nama: ${name}\n`;
                message += `• Alamat / Catatan: ${address}\n`;
                message += `• Metode Pembayaran: ${payment}\n\n`;
                message += `Mohon konfirmasi instruksi pembayaran dan proses pesanan ini ya, terima kasih!`;

                const encodedMessage = encodeURIComponent(message);
                const waUrl = `https://wa.me/${storeObj.whatsapp}?text=${encodedMessage}`;
                
                window.open(waUrl, '_blank');
            });

            cart = [];
            updateCartUI();
            closeCart();
            document.getElementById('checkout-form').reset();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryFilters();
            renderStoreFilters();
            renderCatalog();
            updateCartUI();
        });
    </script>
</body>
</html>
